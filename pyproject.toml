[project]
name = "piper-offload"
version = "0.10.0rc7"
description = "Model-agnostic GPU/CPU memory management for PyTorch — host offloading, block streaming, and LRU model caching."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
keywords = ["inference", "offloading", "pytorch", "quantization", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.13,<2.15",
    "piper-kernels>=0.7.3,<0.8",
]

[project.urls]
Homepage = "https://github.com/Boffee/piper-offload"
Repository = "https://github.com/Boffee/piper-offload.git"
Issues = "https://github.com/Boffee/piper-offload/issues"
Changelog = "https://github.com/Boffee/piper-offload/blob/main/CHANGELOG.md"

[project.optional-dependencies]
bnb = ["bitsandbytes>=0.49,<0.51"]
quanto = ["optimum-quanto>=0.2.7,<0.3"]
# TorchAO's own formats and Piper ConvRot INT8/NVFP4 share one requirement:
# ConvRot tensors subclass `TorchAOBaseTensor`, and the NVFP4 encoder reaches
# TorchAO's `mx_formats` kernels, which import NumPy at module scope.
torchao = ["numpy>=2.3.2,<3", "torchao>=0.18,<0.19"]
# GGUF decodes through ConvRot INT8's Triton converter, which has no fallback.
gguf = [
    "gguf>=0.18,<0.20",
    "piper-offload[torchao,triton]",
]
triton = [
    # Linux PyTorch distributions supply their matching CUDA or ROCm Triton.
    "triton-windows>=3.8,<3.9; sys_platform == 'win32'",
]
all = ["piper-offload[bnb,gguf,quanto,torchao,triton]"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest~=9.1",
    "ruff>=0.16.1",
    # Every adapter backend, so `uv sync` yields a complete test environment
    # (otherwise optional adapter suites silently skip).
    "piper-offload[all]",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.pyright]
include = ["src/piper_offload"]
exclude = ["tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportPrivateImportUsage = "none"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchao = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "ANN", "B", "A", "COM", "C4",
    "DTZ", "EXE", "PIE", "T20", "PT", "SIM", "ARG", "PTH", "UP",
    "ERA", "RUF", "PL",
]
ignore = [
    "ANN002",
    "ANN003",
    "ANN204",
    "COM812",
    "PTH123",
    "PLR2004",
    "N812",
]

[tool.ruff.lint.per-file-ignores]
"src/piper_offload/_triton_*_lora.py" = [
    # Triton JIT kernels expose positional pointer and constexpr parameters.
    "PLR0917",
]
"tests/**/*.py" = [
    # Tests intentionally use local helpers, optional imports guarded by
    # importorskip(), and assertion-oriented context-manager structure.
    "ANN",
    "ARG",
    "B006",
    "B007",
    "ERA001",
    "F841",
    "I001",
    "PLC0415",
    "PT001",
    "PT012",
    "PT018",
    "RUF003",
    "RUF012",
    "RUF043",
    "RUF059",
    "SIM108",
    "SIM117",
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
known-first-party = ["piper_offload"]
