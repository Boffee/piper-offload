---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install development environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test portable backends
        run: uv run pytest

      - name: Build distributions without local sources
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.14 .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python - <<'PY'
          import importlib.metadata

          import piper_offload

          assert importlib.metadata.version("piper-offload")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      # Work around actions/runner-images#14483: affected Intel runners advertise unusable AMX.
      ONEDNN_MAX_CPU_ISA: AVX512_CORE_BF16

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install Windows development environment
        run: uv sync --locked --dev

      - name: Verify Windows Triton selection
        run: >-
          uv run --no-sync python -c "from importlib.metadata import requires, version; import triton;
          assert any(r.startswith('triton-windows') for r in requires('piper-offload') or ());
          assert version('triton-windows').startswith('3.7.');
          assert triton.__version__.startswith('3.7.')"

      - name: Report Windows runner hardware
        shell: pwsh
        run: |
          Write-Output "ImageOS=$env:ImageOS"
          Write-Output "ImageVersion=$env:ImageVersion"
          Get-CimInstance Win32_Processor |
            Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors |
            Format-List
          uv run --no-sync python -c "import platform, torch; print(platform.platform()); print(f'torch={torch.__version__} cuda={torch.version.cuda} available={torch.cuda.is_available()}')"

      - name: Test portable backends
        run: uv run --no-sync pytest
