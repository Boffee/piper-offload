---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Install development environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test portable backends
        run: uv run pytest

      - name: Build distributions without local sources
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.14 .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/python - <<'PY'
          import importlib.metadata

          import piper_offload

          assert importlib.metadata.version("piper-offload")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
